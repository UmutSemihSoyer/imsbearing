version: '3.8'

services:
  api:
    build: .
    container_name: ims_bearing_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always

  dashboard:
    build: .
    container_name: ims_bearing_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: always

  mlflow:
    build: .
    container_name: ims_bearing_mlflow
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///results/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: always
